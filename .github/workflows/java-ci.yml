name: Java CI

on:
  push:
    branches:
      - main
      - feature/research
      - feature/uml
      - feature/java-core
  pull_request:
    branches:
      - main
      - feature/research
      - feature/uml
      - feature/java-core

permissions:
  contents: read

jobs:
  test:
    name: Java 17 build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
